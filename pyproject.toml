[project]
name = "maritime-pipeline-v2"
version = "1.0.0"
description = "Maritime data pipeline with AIS ingestion and dbt transformation"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.1",
    "dbt-duckdb>=1.8.0",
    "duckdb==1.4.4",
    "modal>=0.64",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "scipy>=1.17.1",
    "searoute>=1.1.0",
    "websockets>=16.1.1",
    "zstandard>=0.22.0",
]

# Flat src/ layout, run as an app — uv installs dependencies but does not build the project.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes (flake8 parity), I = import sorting (replaces isort)
select = ["E", "F", "I"]
extend-ignore = ["E203", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
