# .github/workflows/pipeline.yml
name: Maritime Data Pipeline

on:
  # schedule:
  #   - cron: '0 0 * * *'  # daily at midnight UTC (disabled)
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (YYYY) - e.g. 2025'
        required: false
      month:
        description: 'Month (1-12) - Optional'
        required: false
      day:
        description: 'Day (1-31) - Optional'
        required: false

env:
  # injected globally for all steps
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_SECRET }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHON_VERSION: '3.12'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  etl-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: 1. Ingest AIS Data (Extract & Load)
        env: # Inputs mapped to env vars
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
          DAY: ${{ inputs.day }}
        run: |
          # Construct command based on inputs
          CMD="uv run python -m src.ingest_motherduck"

          if [ -n "$YEAR" ]; then CMD="$CMD --year $YEAR"; fi
          if [ -n "$MONTH" ]; then CMD="$CMD --month $MONTH"; fi
          if [ -n "$DAY" ]; then CMD="$CMD --day $DAY"; fi

          echo "Running: $CMD"
          $CMD

      - name: 2. Transform Data (dbt)
        run: |
          uv run dbt deps
          uv run dbt build --profiles-dir . --target prod

      - name: 2b. Upload Operations Metadata
        if: always() # Runs even if dbt fails
        run: |
          uv run python src/upload_artifacts.py

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '20'

      - name: 3. Evidence Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Build Sources
        run: |
          echo "Running evidence sources..."
          npx evidence sources

      - name: Build Evidence Site
        run: |
          echo "Building Evidence site..."
          (while true; do echo "still building..."; sleep 30; done) &
          npx evidence build

      - name: Debug Evidence Output
        if: failure()
        run: |
          echo "Listing Evidence folder after failed build:"
          ls -la .evidence || true
          ls -la .evidence/build || true

      - name: Upload Evidence Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./.evidence/build

  deploy-pages:
    needs: etl-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
