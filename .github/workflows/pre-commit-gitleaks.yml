name: pre-commit & gitleaks CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  precommit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: uv sync --frozen --group dev
      - name: Set up Node (markdownlint-cli2 hook)
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '20'
      - name: Run pre-commit (gitleaks runs in the dedicated job)
        env:
          CI: true
          SKIP: gitleaks
        run: uv run pre-commit run --all-files

  gitleaks:
    name: Run gitleaks (free CLI binary)
    runs-on: ubuntu-latest
    needs: precommit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Go (for gitleaks)
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.21'
      - name: Install gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          sudo mv "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --log-opts "origin/main..HEAD" --verbose
